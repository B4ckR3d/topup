services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: umbreon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umbreon_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Umbr30n_Pg_S3cur3_P@ss_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-umbreon_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umbreon_admin} -d ${POSTGRES_DB:-umbreon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - umbreon-network

  # ==========================================
  # 2. Redis Cache & Queue Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: umbreon-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Umbr30n_R3d1s_Auth_9921_xK!}"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-Umbr30n_R3d1s_Auth_9921_xK!}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - umbreon-network

  # ==========================================
  # 3. Database Schema Migration Runner
  # ==========================================
  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.migration
    container_name: umbreon-migration
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://umbreon_admin:Umbr30n_Pg_S3cur3_P@ss_2026!@postgres:5432/umbreon_db}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - umbreon-network

  # ==========================================
  # 4. Web API (NestJS)
  # ==========================================
  web-api:
    build:
      context: .
      dockerfile: apps/web-api/Dockerfile
    container_name: umbreon-web-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 9991
      DATABASE_URL: ${DATABASE_URL:-postgresql://umbreon_admin:Umbr30n_Pg_S3cur3_P@ss_2026!@postgres:5432/umbreon_db}
      REDIS_URL: ${REDIS_URL:-redis://:Umbr30n_R3d1s_Auth_9921_xK!@redis:6379}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-umbreon_minio}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-Umbr30n_M1n10_S3cur3_2026!}}
      S3_REGION: ${S3_REGION:-${AWS_REGION:-us-east-1}}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-${S3_BUCKET:-umbreon}}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_URL: ${S3_URL:-http://84.247.148.122:9000}
    ports:
      - "${WEB_API_PORT:-9991}:9991"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      minio:
        condition: service_started
        required: false
    networks:
      - umbreon-network

  # ==========================================
  # 5. Web Admin (AdonisJS 6 + Inertia SSR)
  # ==========================================
  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        VITE_S3_URL: ${VITE_S3_URL:-http://84.247.148.122:9000/umbreon}
    container_name: umbreon-web-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://umbreon_admin:Umbr30n_Pg_S3cur3_P@ss_2026!@postgres:5432/umbreon_db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      DRIVE_DISK: ${DRIVE_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-umbreon_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-Umbr30n_M1n10_S3cur3_2026!}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-umbreon}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-umbreon}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      VITE_S3_URL: ${VITE_S3_URL:-http://84.247.148.122:9000/umbreon}
    ports:
      - "${WEB_ADMIN_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_started
        required: false
    networks:
      - umbreon-network

  # ==========================================
  # 6. Web Client (React Router v7)
  # ==========================================
  web-client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:9991}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_S3_URL: ${VITE_S3_URL:-http://84.247.148.122:9000/umbreon}
    container_name: umbreon-web-client
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 9992
      INTERNAL_API_URL: http://web-api:9991
      DATABASE_URL: ${DATABASE_URL:-postgresql://umbreon_admin:Umbr30n_Pg_S3cur3_P@ss_2026!@postgres:5432/umbreon_db}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:9991}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "${WEB_CLIENT_PORT:-9992}:9992"
    depends_on:
      - web-api
    networks:
      - umbreon-network

  # ==========================================
  # 7. Nginx Ingress / Gateway
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: umbreon-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-api
      - web-admin
      - web-client
    networks:
      - umbreon-network

  # ==========================================
  # 8. MinIO Object Storage (Pengganti AWS S3 Lokal)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: umbreon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-umbreon_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Umbr30n_M1n10_S3cur3_2026!}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - umbreon-network

  createbuckets:
    image: minio/mc:latest
    container_name: umbreon-minio-init
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-umbreon_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Umbr30n_M1n10_S3cur3_2026!}
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminio/umbreon --ignore-existing;
      mc anonymous set public myminio/umbreon;
      exit 0;
      "
    networks:
      - umbreon-network

networks:
  umbreon-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
